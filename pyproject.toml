[project]
name = "motz-loan-prediction"
version = "1.0.0"
description = "Explainable machine-learning system that predicts loan approval for Motz Financial Services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DIAL3110 Group Assignment" }]
keywords = ["machine-learning", "credit-scoring", "loan-prediction", "explainable-ai"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.36",
    "joblib>=1.4",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
